<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>技术方向看板 - 小七仔 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center; margin-bottom: 30px; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 16px;
        }
        header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; font-size: 0.85em; margin-top: 6px; }
        .back-link { color: #00d4ff; text-decoration: none; font-size: 0.85em; }

        .stats-row {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            padding: 16px; background: rgba(255,255,255,0.08);
            border-radius: 12px; text-align: center;
        }
        .stat-num { font-size: 1.8em; font-weight: bold; background: linear-gradient(90deg, #00d4ff, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 0.7em; color: #888; margin-top: 2px; }

        /* Chart section */
        .chart-card {
            background: rgba(255,255,255,0.06);
            border-radius: 16px; padding: 20px; margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .chart-card h2 {
            font-size: 1em; color: #ccc; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .chart-wrapper { position: relative; width: 100%; min-height: 340px; }

        .dir-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;
            margin-bottom: 24px;
        }
        .dir-card {
            background: rgba(255,255,255,0.06);
            border-radius: 16px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
        }
        .dir-card:hover { border-color: rgba(0,212,255,0.3); }

        .dir-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .dir-name { font-size: 1.1em; font-weight: bold; color: #00d4ff; }
        .dir-meta { display: flex; gap: 6px; align-items: center; }
        .dir-status {
            font-size: 0.7em; padding: 2px 10px; border-radius: 10px;
        }
        .status-active { background: rgba(0,200,80,0.2); color: #4CAF50; }
        .status-warm { background: rgba(255,152,0,0.2); color: #FF9800; }
        .status-cold { background: rgba(255,255,255,0.05); color: #888; }

        .dots { display: flex; gap: 4px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.on { background: #00d4ff; box-shadow: 0 0 8px rgba(0,212,255,0.5); }
        .dot.off { background: rgba(255,255,255,0.1); }

        .dir-body { font-size: 0.85em; line-height: 1.6; }
        .dir-body .section { margin-bottom: 10px; }
        .dir-body .label { color: #888; font-size: 0.8em; margin-bottom: 4px; }
        .dir-body .value { color: #ccc; }
        .dir-body .value a { color: #00d4ff; text-decoration: none; }
        .dir-body .value a:hover { text-decoration: underline; }
        .tag {
            display: inline-block; font-size: 0.75em; padding: 1px 8px;
            border-radius: 6px; margin: 2px;
        }
        .tag-need { background: rgba(0,212,255,0.15); color: #00d4ff; }
        .tag-client { background: rgba(123,44,191,0.2); color: #b794d4; }
        .tag-news { background: rgba(255,152,0,0.15); color: #FF9800; }

        .footer-edit {
            margin-top: 14px; padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between;
            font-size: 0.78em; color: #666;
        }
        .update-btn { color: #00d4ff; cursor: pointer; }

        footer { text-align: center; padding: 20px; color: #666; font-size: 0.78em; }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .dir-grid { grid-template-columns: 1fr; }
            .chart-wrapper { min-height: 280px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 技术方向看板</h1>
            <div class="subtitle">技术树 × 方案库 · 每日自动刷新</div>
            <a href="index.html" class="back-link">← 返回 Dashboard</a>
        </header>

        <div class="stats-row" id="stats-row">
            <div class="stat-card"><div class="stat-num" id="stat-dir">—</div><div class="stat-label">技术方向</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-client">—</div><div class="stat-label">关联客户</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-need">—</div><div class="stat-label">测试需求</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-active">—</div><div class="stat-label">活跃跟进</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-updated">—</div><div class="stat-label">最后更新</div></div>
        </div>

        <!-- Bar chart section -->
        <div class="chart-card">
            <h2>📊 各方向拜访次数统计</h2>
            <div class="chart-wrapper">
                <canvas id="visitChart"></canvas>
            </div>
            <div id="chart-legend" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);"></div>
        </div>

        <div class="dir-grid" id="dir-grid"></div>
        <footer>
            <p>小七仔 Dashboard · 技术方向看板 <span id="footer-updated"></span></p>
            <p style="margin-top:6px;">数据最终来源于 MEMORY.md + visits.html · 每日自动刷新</p>
        </footer>
    </div>

    <script>
        const DATA_URL = 'tech-directions-data.json';

        let dataCache = null;

        async function loadData() {
            const resp = await fetch(DATA_URL + '?_=' + Date.now());
            dataCache = await resp.json();
            return dataCache;
        }

        function renderStats(data) {
            const m = data.meta;
            const now = new Date();
            const dateStr = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate();
            document.getElementById('stat-dir').textContent = m.totalDirections;
            document.getElementById('stat-client').textContent = m.totalClients;
            document.getElementById('stat-need').textContent = m.totalNeeds;
            document.getElementById('stat-active').textContent = m.activeFollowups;
            document.getElementById('stat-updated').textContent = dateStr;
            document.getElementById('footer-updated').textContent = '· 更新于 ' + dateStr;
        }

        function renderChart(data) {
            const dirs = data.directions;
            const colors = ['#00d4ff', '#7b2cbf', '#4CAF50', '#FF9800', '#f44336', '#9C27B0'];
            const bgColors = ['rgba(0,212,255,0.6)', 'rgba(123,44,191,0.6)', 'rgba(76,175,80,0.6)',
                              'rgba(255,152,0,0.6)', 'rgba(244,67,54,0.6)', 'rgba(156,39,176,0.6)'];

            // Color legend below chart
            const legendEl = document.getElementById('chart-legend');
            dirs.forEach((d, i) => {
                const item = document.createElement('span');
                item.style.cssText = 'display:inline-flex;align-items:center;gap:6px;font-size:0.78em;color:#ccc;';
                item.innerHTML = `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${colors[i]};flex-shrink:0;"></span>${d.name} <span style="color:#00d4ff;font-weight:bold;">${d.visitCount}次</span>`;
                legendEl.appendChild(item);
            });

            new Chart(document.getElementById('visitChart'), {
                type: 'bar',
                data: {
                    labels: dirs.map(d => d.name),
                    datasets: [{
                        label: '拜访次数',
                        data: dirs.map(d => d.visitCount),
                        backgroundColor: bgColors.slice(0, dirs.length),
                        borderColor: colors.slice(0, dirs.length),
                        borderWidth: 2,
                        borderRadius: 6,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleColor: '#00d4ff',
                            bodyColor: '#e0e0e0',
                            padding: 10,
                            cornerRadius: 8
                        }
                    },
                    },
                    animation: {
                        onComplete: function() {
                            // Draw value labels on top of bars
                            const chart = this;
                            const ctx = chart.ctx;
                            ctx.save();
                            chart.data.datasets.forEach(function(ds, dsIdx) {
                                const meta = chart.getDatasetMeta(dsIdx);
                                meta.data.forEach(function(bar, idx) {
                                    const val = ds.data[idx];
                                    if (val === null || val === undefined) return;
                                    ctx.fillStyle = '#00d4ff';
                                    ctx.font = 'bold 14px -apple-system, sans-serif';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'bottom';
                                    ctx.fillText(val, bar.x, bar.y - 6);
                                });
                            });
                            ctx.restore();
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                color: '#888',
                                font: { size: 11 }
                            },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        x: {
                            ticks: {
                                color: '#e0e0e0',
                                font: { size: 12 },
                                autoSkip: false,
                                maxRotation: 45,
                                minRotation: 0
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderCards(data) {
            const grid = document.getElementById('dir-grid');
            grid.innerHTML = data.directions.map(d => {
                const statusClass = d.status === 'active' ? 'status-active' : d.status === 'warm' ? 'status-warm' : 'status-cold';
                const dotsHtml = Array.from({length: 5}, (_, i) => `<span class="dot ${i < d.dots ? 'on' : 'off'}"></span>`).join('');
                const needsHtml = d.needs.map(n => `<span class="tag tag-need">${n}</span>`).join('');
                const clientsHtml = d.clients.map(c => `<span class="tag tag-client">${c}</span>`).join('');
                const newsHtml = d.news.map(n => `<span class="tag tag-news">${n}</span>`).join('');
                return `<div class="dir-card">
                    <div class="dir-header">
                        <div class="dir-name">${d.name}</div>
                        <div class="dir-meta">
                            <span class="dir-status ${statusClass}">${d.statusLabel}</span>
                            <div class="dots">${dotsHtml}</div>
                        </div>
                    </div>
                    <div class="dir-body">
                        <div class="section">
                            <div class="label">关联客户</div>
                            <div class="value">${clientsHtml}</div>
                        </div>
                        <div class="section">
                            <div class="label">当前测试需求</div>
                            <div class="value">${needsHtml}</div>
                        </div>
                        <div class="section">
                            <div class="label">相关新闻热度</div>
                            <div class="value">${newsHtml}</div>
                        </div>
                        <div class="section">
                            <div class="label">最近拜访</div>
                            <div class="value" style="color:#bbb; font-size:0.9em;">${d.recentVisit}</div>
                        </div>
                        <div class="section">
                            <div class="label">下一步</div>
                            <div class="value" style="color:#ffc800;">👉 ${d.nextStep}</div>
                        </div>
                        <div class="footer-edit">
                            <span>方案: ${d.solutions.substring(0, 35)}...</span>
                            <span>拜访 ${d.visitCount} 次</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function init() {
            try {
                const data = await loadData();
                renderStats(data);
                renderChart(data);
                renderCards(data);
            } catch (e) {
                document.getElementById('dir-grid').innerHTML = `<div style="padding:40px;text-align:center;color:#888;">⚠️ 加载数据失败: ${e.message}</div>`;
            }
        }
        init();
    </script>
</body>
</html>
